name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simuler une panne au déploiement"
        type: boolean
        default: false

permissions:
  contents: read

env:
  APP_VERSION: "1.0.0"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  build:
    name: Image Docker
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construire
        run: |
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" .

      - name: Démarrer et contrôler /health (60 s max)
        run: |
          docker run -d --name smoke -p 8080:8000 "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then break; fi
            [ "$i" -eq 30 ] && { docker logs smoke; exit 1; }
            sleep 2
          done
          curl -fsS http://localhost:8080/version | grep -q "\"$GITHUB_SHA\""
          docker rm -f smoke

      # Publication uniquement sur main (push ou lancement manuel), jamais depuis une PR.
      - name: Connexion à GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image validée et récupérer son digest
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "image=$ref" >> "$GITHUB_OUTPUT"
          echo "Image publiée : \`$ref\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Déploiement préproduction
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: preprod
    concurrency: preprod
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      SSH_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      APP_PORT: ${{ vars.DEPLOY_APP_PORT || '8080' }}
      SIMULATE_FAILURE: ${{ inputs.simulate_failure && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer la clé SSH et l'empreinte de la VM
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Déployer l'image par son digest
        run: |
          ssh_opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes)
          scp "${ssh_opts[@]}" -P "$SSH_PORT" deploy.sh "$SSH_TARGET:deploy.sh"
          ssh "${ssh_opts[@]}" -p "$SSH_PORT" "$SSH_TARGET" \
            "APP_PORT=$APP_PORT SIMULATE_FAILURE=$SIMULATE_FAILURE bash deploy.sh '$IMAGE' '$GITHUB_SHA'"
          echo "Déployé sur la VM : \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyer la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
