<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaServices Tickets</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280; --border: #e2e5ea;
      --accent: #2563eb; --ko: #dc2626;
      --basse: #64748b; --normale: #2563eb; --haute: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b1f27; --text: #e5e7eb; --muted: #9ca3af; --border: #2c323d;
        --accent: #60a5fa; --basse: #94a3b8; --normale: #60a5fa; --haute: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.5rem; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 20px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    form, .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    input { flex: 1 1 220px; }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    .error { color: var(--ko); margin: 8px 0 0; min-height: 1.2em; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: .85rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .8rem; border: 1px solid currentColor; }
    .prio-basse { color: var(--basse); } .prio-normale { color: var(--normale); } .prio-haute { color: var(--haute); }
    .empty { color: var(--muted); text-align: center; padding: 20px; }
    footer { margin-top: 20px; color: var(--muted); font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>NovaServices — Tickets</h1>
  </header>

  <section>
    <h2>Nouveau ticket</h2>
    <form id="form">
      <input id="titre" placeholder="Décrire le problème" required>
      <select id="priorite">
        <option value="basse">Basse</option>
        <option value="normale" selected>Normale</option>
        <option value="haute">Haute</option>
      </select>
      <button type="submit">Créer</button>
    </form>
    <p id="error" class="error"></p>
  </section>

  <section>
    <div class="toolbar">
      <h2 style="flex:1">Tickets</h2>
      <select id="filtre">
        <option value="">Tous les statuts</option>
        <option value="ouvert">Ouvert</option>
        <option value="en_cours">En cours</option>
        <option value="ferme">Fermé</option>
      </select>
    </div>
    <table>
      <thead><tr><th>#</th><th>Titre</th><th>Priorité</th><th>Statut</th></tr></thead>
      <tbody id="tickets"></tbody>
    </table>
  </section>

  <footer id="version"></footer>
</main>

<script>
  const STATUTS = { ouvert: "Ouvert", en_cours: "En cours", ferme: "Fermé" };
  const $ = (id) => document.getElementById(id);

  function cell(text, className) {
    const td = document.createElement("td");
    if (className) {
      const span = document.createElement("span");
      span.className = className;
      span.textContent = text;
      td.append(span);
    } else {
      td.textContent = text;
    }
    return td;
  }

  async function loadTickets() {
    const statut = $("filtre").value;
    const res = await fetch("/tickets" + (statut ? "?statut=" + encodeURIComponent(statut) : ""));
    const tickets = await res.json();
    const body = $("tickets");
    body.replaceChildren();
    if (!tickets.length) {
      body.innerHTML = '<tr><td colspan="4" class="empty">Aucun ticket</td></tr>';
      return;
    }
    for (const t of tickets) {
      const tr = document.createElement("tr");
      tr.append(
        cell(t.id),
        cell(t.titre),
        cell(t.priorite, "badge prio-" + t.priorite),
        cell(STATUTS[t.statut] || t.statut),
      );
      body.append(tr);
    }
  }

  async function loadVersion() {
    const v = await (await fetch("/version")).json();
    $("version").textContent = `Version ${v.version} · commit ${v.commit.slice(0, 7)}`;
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("error").textContent = "";
    const res = await fetch("/tickets", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titre: $("titre").value, priorite: $("priorite").value }),
    });
    if (!res.ok) {
      $("error").textContent = (await res.json()).erreur;
      return;
    }
    $("titre").value = "";
    loadTickets();
  });

  $("filtre").addEventListener("change", loadTickets);
  loadTickets();
  loadVersion();
</script>
</body>
</html>
